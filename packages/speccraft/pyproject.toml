[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deliveryflow-speccraft"
version = "0.1.0"
description = "Project scaffold for the SpecCraft Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deliveryflow-agent-kernel==0.1.0",
  "deliveryflow-contracts==0.1.0",
  "fastapi>=0.115,<1",
  "langgraph>=1.2.12,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deliveryflow_speccraft"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
